name: Sync upstream hourly
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-upstream
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge upstream main without force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/anyhui/open-pose-costume/merge-upstream -f branch=main
